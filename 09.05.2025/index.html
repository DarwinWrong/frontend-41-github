<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input,
      textarea,
      button {
        padding: 8px;
        font-size: 16px;
      }
      .post {
        background-color: #fef5a1;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <form id="postForm">
      <input type="text" id="title" placeholder="Заголовок" />
      <textarea id="body" placeholder="Опис"></textarea>
      <button type="submit">Створити пост</button>
    </form>
    <div id="postsContainer"></div>

    <script src="main.js"></script>
  </body>
</html>
