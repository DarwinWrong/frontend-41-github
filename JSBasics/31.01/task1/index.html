<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!--Завдання 1-->
    <section>
        <h2>Завдання 1: Зміна тексту</h2>
        <p id="text">Привіт, світ!</p>
        <button id="changeTextBtn">Змінити</button>
        <button id ="changeTextBtn2" style="display: none;">Змінити назад</button>
    </section>

    <hr>

    <!--Завдання 2-->
    <section>
        <h2>Завдання 2: Динамічний список</h2>
        <input type="text" id="listInput" placeholder="Введіть елемент">
        <button id="addItemBtn">Додати</button>
        <ul id="dynamicList"></ul>
    </section>

    <hr>

    <!-- Завдання 3-->
    <section>
        <h2>Завдання 3: Зміна картинки</h2>
        <img id="image" src="image1.png" alt="Зображення" width="300">
        <button id="changeImageBtn">Змінити картинку</button>
    </section>

    <script src="script.js"></script>
</body>
</html>
