<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анімоване меню та картки</title>
    <!-- <link rel="stylesheet" href="styles.css" /> -->
    <style>
      :root {
        --main-color: #333;
        --menu-color: #222;
        --link-color: #fff;
        --tips-color: #c5f077;
      }
      /* Загальні стилі */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: var(--main-color);
        background: url("images/st-fon-1.jpg") no-repeat center center fixed;
        background-size: cover;
        height: 1000px;
      }

      /* Фіксований фон */
      .parallax {
        /* height: 300px; */
        /* background: url("images/st-fon-1.jpg") no-repeat center center fixed;
        background-size: cover; */
      }

      .animated-menu {
        position: sticky;
        top: 0;
        z-index: 3;
      }

      /* Анімоване меню */
      .animated-menu ul {
        display: flex;
        list-style: none;
        margin: 0;
        padding: 0;
        background: #222;
        justify-content: space-around;
      }

      .animated-menu ul li {
        position: relative;
        margin: 0;
      }

      .animated-menu ul li a {
        display: block;
        padding: 15px 20px;
        color: #fff;
        text-decoration: none;
        transition: background 0.3s;
      }

      .animated-menu ul li a:hover {
        background: #555;
      }

      .animated-menu ul li a::after {
        content: attr(title);
        position: absolute;
        bottom: -1.8em;
        left: 50%;
        transform: translateX(-50%);
        background: #333;
        color: #c5f077;
        padding: 5px 10px;
        font-size: 12px;
        border-radius: 3px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s;
        white-space: nowrap;
      }

      .animated-menu ul li a:hover::after {
        opacity: 1;
        visibility: visible;
      }

      /* Блок карток */
      .product-cards {
        margin-top: 20vh;
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        padding: 20px;
        background: black;
      }

      .card {
        position: relative;
        width: 200px;
        text-align: center;
        margin: 10px;
        padding: 15px;
        background: black;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s, box-shadow 0.3s;
        color: #fff;
        border: 2px double white;
        border-radius: 20px;
        cursor: pointer;
      }

      .card img {
        width: 100%;
        transition: transform 0.3s;
      }

      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .card img:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <!-- Фіксований фон -->
    <div class="parallax"></div>

    <!-- Анімоване меню -->
    <nav class="animated-menu">
      <ul>
        <li><a href="#" title="Перейти на головну">Головна</a></li>
        <li><a href="#" title="Дізнатися про нас">Про нас</a></li>
        <li><a href="#" title="Переглянути послуги">Послуги</a></li>
        <li><a href="#" title="Зв'язатися з нами">Контакти</a></li>
      </ul>
    </nav>

    <!-- Блок карток -->
    <section class="product-cards">
      <div class="card">
        <img src="images/st-1.webp" alt="Товар 1" title="Деталі товару 1" />
        <h3>Star Wars Toys</h3>
        <p>Опис товару 1.</p>
      </div>
      <div class="card">
        <img src="images/st-2.webp" alt="Товар 2" title="Деталі товару 2" />
        <h3>Homeware</h3>
        <p>Опис товару 2.</p>
      </div>
      <div class="card">
        <img src="images/st-3.webp" alt="Товар 3" title="Деталі товару 3" />
        <h3>Star Wars Collectibles</h3>
        <p>Опис товару 3.</p>
      </div>
    </section>
  </body>
</html>
