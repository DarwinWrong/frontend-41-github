<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Goal Animations</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #2ecc71;
        height: 100vh;
        margin: 0;
        padding: 0;
        position: relative;
      }
      .scene {
        position: relative;
        width: 49.5%;
        height: 450px;
        border: 1px solid black;
        margin: 10px auto;
      }
      .player {
        position: absolute;
        width: 50px;
        height: 120px;
        padding: 5px;
        background-color: #2980b9;
        writing-mode: vertical-lr;
        text-orientation: upright;
        text-align: center;
        align-content: center;
        /* animation: bit 1s ease 1s forwards; */
      }
      .ball {
        position: absolute;
        width: 40px;
        height: 40px;
        background-color: white;
        border: 1px dashed black;
        border-radius: 50%;
        box-shadow: 0 0 5px black;
        z-index: 2;
        animation: score 1s ease-out infinite;
      }
      @keyframes bit {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(30deg);
        }
      }
      @keyframes score {
        from {
          left: 45%;
          bottom: 0;
        }
        to {
          left: 45%;
          bottom: 85%;
        }
      }
      .vorota {
        position: absolute;
        width: 140px;
        height: 80px;
        background-color: #fff;
        border: 5px solid black;
        border-top: 10px solid black;
        border-bottom: 0;
      }

      /*Анімація №1: Ворота справа, футболіст зліва*/
      .scene-1 .player {
        left: 40%;
        bottom: 0;
      }
      .scene-1 .ball {
        left: 45%;
        bottom: 0;
      }
      .scene-1 .vorota {
        top: 0;
        left: 40%;
      }
    </style>
  </head>
  <body>
    <!-- Анімація №1: Ворота справа, футболіст зліва -->
    <div class="scene scene-1">
      <div class="player">player</div>
      <div class="ball"></div>
      <div class="vorota"></div>
    </div>
  </body>
</html>
