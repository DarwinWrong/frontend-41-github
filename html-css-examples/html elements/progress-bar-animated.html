<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>menu 23</title>
  </head>
  <body>
    <style>
          *
          {
              margin:0;
              padding:0;
              font-family:'Roboto',sans-serif;
          }
          body
          {
              background:#03a9f4;
              align-items:center;
              justify-content:center;
              min-height:100vh;
              display:flex;
              flex-direction: column;
          }
          .spacer {
              width:100%;
              height: 110vh;
          }
          .box
          {
              background:#fff;
              width:300px;
              height:400px;
              display:flex;
              justify-content:center;
              align-items:center;
              position:relative;
              flex-direction:column;
              box-shadow:0 30px 60px rgba(0,0,0,.4);
              transition: transform .2s;
          }
          .box .percent
          {
              width:150px;
              height:150px;
              position:relative;
          }
          .box .percent svg
          {
              width:150px;
              height:150px;
              position:relative;
          }
          .box .percent svg circle
          {
              width:150px;
              height:150px;
              fill:none;
              stroke-width:10;
              stroke:#000;
              transform:translate(5px,5px);
              stroke-dasharray:440;
              stroke-dashoffset:440;
              stroke-linecap:round;
          }
          .box .percent svg circle:nth-child(1)
          {
              stroke-dashoffset: 0;
              stroke:#f3f3f3
          }
          .box .percent svg circle:nth-child(2)
          {
              stroke-dashoffset: calc(440 - (440 * 87) / 100);
              stroke:#03a9f4;
              opacity: 0;
              transition: opacity 0.5s linear;
          }
          .box .percent svg {
            transform: rotate(-90deg) scale(1, -1);
          }
          .box .percent svg circle:nth-child(2).animate-box {
              opacity: 1;
              animation: animate-progress 1.2s linear forwards;
          }
          .box .percent .num
          {
              top:0;
              left:0;
              width:100%;
              height:100%;
              display:flex;
              justify-content:center;
              align-items:center;
              position:absolute;
              color:#111;
          }
          .box .percent .num h2
          {
              font-size:48px;
          }
          .box .percent .num h2 span
          {
              font-size:24px;
          }
          .box .text
          {
              padding 10px 0 0;
              color:#999;
              font-weight:700;
              letter-spacing:1px;
          }

      @keyframes animate-progress {
          0% {
              stroke-dashoffset: 440;
          }
          100% {
              stroke-dashoffset: 57.2;
          }
      }
    </style>
    <!--HYTML-->
    <div class="spacer"></div>
    <div class="box">
      <div class="percent">
        <svg>
          <circle cx="70" cy="70" r="70"></circle>
          <circle cx="70" cy="70" r="70"></circle>
        </svg>
        <div class="num">
          <h2>87<span>%</span></h2>
        </div>
      </div>
      <h2 class="text">Progress</h2>
    </div>
    <!--/HTML-->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        let box = document.querySelector(".percent svg circle:nth-child(2)");

        let observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                box.classList.add("animate-box");
              }
            });
          },
          { threshold: 0.5 }
        );

        observer.observe(box);
      });
    </script>
  </body>
</html>
