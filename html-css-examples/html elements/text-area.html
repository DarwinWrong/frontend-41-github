<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textarea</title>
  </head>
  <body>
    <label for="message">Ваше повідомлення:</label>
    <textarea
      id="message"
      name="message"
      rows="4"
      cols="50"
      maxlength="100"
      placeholder="text"
      required
    >
        Напишіть свій коментар тут...</textarea
    >
  </body>
</html>
