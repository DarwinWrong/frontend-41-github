<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<div class="content">
    <h1>What is Lorem Ipsum?</h1>
    <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry...</p>
    <button class="btn-open" onclick="document.querySelector('.overlay').classList.add('active')">
        Open Modal
    </button>
</div>

<div class="overlay">
    <div class="modal">
        <h2>Modal Window</h2>
        <p>This is a modal window with some text.</p>
        <button onclick="document.querySelector('.overlay').classList.remove('active')">
            Close
        </button>
    </div>
</div>
</body>
</html>
