<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation with Design Patterns</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="personForm">
      <label>Username: <input type="text" name="username" /></label><br />
      <label>Year of Birth: <input type="number" name="year" /></label><br />
      <label
        >Eye Color:
        <select name="eyeColor">
          <option value="">Select</option>
          <option value="brown">Brown</option>
          <option value="green">Green</option>
          <option value="gray">Gray</option>
          <option value="blue">Blue</option>
        </select> </label
      ><br />
      <label
        >Hair Color:
        <select name="hairColor">
          <option value="">Select</option>
          <option value="black">Black</option>
          <option value="brown">Brown</option>
          <option value="white">White</option>
          <option value="red">Red</option>
          <option value="other">Other</option>
        </select> </label
      ><br />
      <label
        >Height (m): <input type="number" step="0.01" name="height" /></label
      ><br />
      <label
        >Weight (kg): <input type="number" step="0.1" name="weight" /></label
      ><br />
      <button type="submit">Submit</button>
    </form>
    <div id="result"></div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
