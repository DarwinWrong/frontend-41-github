<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

<div class="container">
  <h1>Завдання</h1>

  <div class="task">
    <h2>🚀 Піцайоло та замовлення 🍕</h2>
    <button onclick="takePizzaOrder()">Замовити піцу</button>
    <div class="output" id="pizzaOutput"></div>
  </div>

  <div class="task">
    <h2>🎭 Театр та ролі</h2>
    <button onclick="assignActorRole()">Призначити роль</button>
    <div class="output" id="theaterOutput"></div>
  </div>

  <div class="task">
    <h2>🚕 Таксист та пасажир</h2>
    <button onclick="pickUpPassenger()">Підібрати пасажира</button>
    <div class="output" id="taxiOutput"></div>
  </div>

  <div class="task">
    <h2>🎤 Концертна програма 🎶</h2>
    <button onclick="startConcert()">Почати концерт</button>
    <div class="output" id="concertOutput"></div>
  </div>
</div>

<script src="js/script.js"></script>

</body>
</html>
