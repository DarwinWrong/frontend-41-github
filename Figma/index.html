<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>Contact Us</h1>
            <p>Most calendars are designed for teams.<br> Slate is designed for freelancers</p>
        </div>
        <div class="container">
            <div class="contact-form">
                <form>
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <textarea placeholder="Your Message" required></textarea>
                    <button type="submit">Send</button>
                </form>
            </div>

            <!-- Виставив смайлики замість картинок, аби не шукати їх -->
            <div class="contact-info">
                <p><span class="icon">📍</span> 6386 Spring St undefined<br> Anchorage, Georgia 12473 United States</p>
                <p><span class="icon">📞</span> (843) 555-0130</p>
                <p><span class="icon">📧</span> willie.jennings@example.com</p>
                <div class="social-icons">
                    <a href="#"><span>🐦</span></a>
                    <a href="#"><span>📘</span></a>
                    <a href="#"><span>🔗</span></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
