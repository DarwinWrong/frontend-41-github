<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h3>Adaptive Gallery</h3>

        <div class="block first">
            <span class="low-res">400 x 200</span>
            <span class="high-res">600 x 400</span>
        </div>
        <div class="block second">
            <span class="low-res">200 x 100</span>
            <span class="high-res">400 x 300</span>
        </div>
        <div class="block third">
            <span class="low-res">150 x 300</span>
            <span class="high-res">300 x 300</span>
        </div>
        <div class="block fourth">
            <span class="low-res">150 x 300</span>
            <span class="high-res">300 x 300</span>
        </div>
        <div class="block fifth">
            <span class="low-res">150 x 300</span>
            <span class="high-res">300 x 600</span>
        </div>
        <div class="block sixth">
            <span class="low-res">150 x 300</span>
            <span class="high-res">300 x 300</span>
        </div>
        <div class="block seventh">
            <span class="low-res">150 x 300</span>
            <span class="high-res">300 x 300</span>
        </div>
    </div>
</body>
</html>
