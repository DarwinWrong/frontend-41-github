<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Академія супергероїв та Маски на вечірку</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <h1>Академія супергероїв: Вибір команди</h1>
  <div id="hero-list"></div>

  <h1>Створи свою маску на вечірку</h1>
  <form id="mask-form">
    <label for="name">Ім'я:</label>
    <input type="text" id="name" required><br><br>
    <label for="color">Колір маски:</label>
    <input type="text" id="color" required><br><br>
    <button type="submit">Готово!</button>
  </form>

  <div id="mask-container"></div>

  <script src="js/script.js"></script>
</body>
</html>
