<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #trackbar {
        width: 80%;
        height: 10px;
        background-color: #ccc;
        margin: 50px auto;
        position: relative;
        border-radius: 5px;
      }
      #indicator {
        width: 20px;
        height: 20px;
        background-color: blue;
        border-radius: 50%;
        position: absolute;
        top: -5px;
        left: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="trackbar">
      <div id="indicator"></div>
    </div>
    <script src="task1.js"></script>
  </body>
</html>
