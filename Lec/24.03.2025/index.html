<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <form class="form_container" novalidate>
      <h2>Sing up</h2>
      <div class="form_group">
        <label for="firsName">First Name</label>
        <input type="text" id="firstName" name="firstName" required />
        <small>Тільки 2-30 літер</small>
      </div>
      <div class="form_group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required />
        <small>Тільки 2-30 літер</small>
      </div>
      <div class="form_group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <small>Існуюча електрона пошта</small>
      </div>
      <div class="form_group">
        <label for="password">Your password</label>
        <input type="password" id="password" name="password" required />
        <small>Ведіь пароль</small>
      </div>
      <div class="form_group">
        <label for="confirPassword">Your password</label>
        <input
          type="password"
          id="confirPassword"
          name="confirPassword"
          required
        />
        <small>Мають бути однаковими</small>
      </div>
      <button type="submit">Створити акаунт</button>
    </form>
    <script src="./main.js"></script>
  </body>
</html>
