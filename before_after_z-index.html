<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .group-1,
      .group-2 {
        position: relative;
        width: 200px;
        height: 200px;
        margin: 20px;
      }

      .group-1:before,
      .group-2:before {
        content: "";
        position: absolute;
        top: -50%;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 0, 0, 1);
      }
      .group-1:before {
        z-index: 1;
      }
      .group-1:after {
        z-index: 2;
      }

      .group-1:after,
      .group-2:after {
        content: "";
        position: absolute;
        bottom: -50%;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 255, 1);
      }
      .group-2::before {
        z-index: 3;
      }
      .group-2:after {
        background-color: rgba(0, 0, 75, 1);
        z-index: 4;
      }

      /* Якщо батьківські елементи мають один і той самий z-index, то їх псевдоелементи
   будуть перекривати один одного, якщо stack context однаковий */
      .group-1 {
        background-color: lightgreen;
        /* z-index: 1; */
      }

      .group-2 {
        background-color: green;
        /* z-index: 1; */
        transform: rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div class="group-1">
      <div class="content">Group 1 Content</div>
    </div>

    <div class="group-2">
      <div class="content">Group 2 Content</div>
    </div>
  </body>
</html>
