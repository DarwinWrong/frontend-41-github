<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <style>
      header {
        background-image: url(images/background.jpg);
        background-size: cover;
        background-position-y: 25%;
        background-repeat: no-repeat;
        height: 150px;
      }
    </style>
  </head>
  <body class="bg-dark">
    <header>
      <h1 class="pt-5 text-center text-white">HAPPY NEW YEAR 2025!</h1>
    </header>
    <main>
      <div class="container m-2 p-4">
        <div class="row">
          <div class="col-12 col-xxl-2">
            <div class="sidebar bg-secondary text-light p-3 h-100">
              <ul class="nav nav-pills flex-column gap-2">
                <li class="nav-item">
                  <a
                    href="#"
                    class="nav-link text-black d-flex align-items-center"
                  >
                    <i class="bi bi-tree me-2 text-black"></i>
                    Home
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    href="#"
                    class="nav-link text-black d-flex align-items-center"
                  >
                    <i class="bi bi-gift me-2 text-black"></i>
                    Completed Tasks
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    href="#"
                    class="nav-link text-black d-flex align-items-center"
                  >
                    <i class="bi bi-calendar-check me-2 text-black"></i>
                    Goals
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    href="#"
                    class="nav-link text-black d-flex align-items-center"
                  >
                    <i class="bi bi-star me-2 text-black"></i>
                    Wishes
                  </a>
                </li>
              </ul>
            </div>
          </div>

          <div class="col-12 col-xxl-10">
            <section id="carousel">
              <div
                id="carouselExampleDark"
                class="carousel carousel-dark slide"
              >
                <div class="carousel-inner">
                  <div class="carousel-item active" data-bs-interval="10000">
                    <img
                      src="images/christmas.jpg"
                      class="d-block w-100"
                      alt="..."
                    />
                  </div>
                  <div class="carousel-item" data-bs-interval="2000">
                    <img
                      src="images/holiday.jpg"
                      class="d-block w-100"
                      alt="..."
                    />
                  </div>
                  <div class="carousel-item">
                    <img
                      src="images/decoration.jpg"
                      class="d-block w-100"
                      alt="..."
                    />
                  </div>
                </div>
                <button
                  class="carousel-control-prev bg-white"
                  type="button"
                  data-bs-target="#carouselExampleDark"
                  data-bs-slide="prev"
                  style="width: 50px"
                >
                  <span
                    class="carousel-control-prev-icon"
                    aria-hidden="true"
                  ></span>
                  <span class="visually-hidden">Previous</span>
                </button>
                <button
                  class="carousel-control-next bg-white"
                  type="button"
                  data-bs-target="#carouselExampleDark"
                  data-bs-slide="next"
                  style="width: 50px"
                >
                  <span
                    class="carousel-control-next-icon"
                    aria-hidden="true"
                  ></span>
                  <span class="visually-hidden">Next</span>
                </button>
              </div>
            </section>
          </div>
          <section class="bg-dark text-light py-3">
            <div class="container">
              <h4 class="mb-3">
                <i class="bi bi-bullseye me-2"></i> Progress of Completed Tasks
              </h4>
              <div class="mb-3">
                <label class="form-label fw-bold"
                  >Task 1: Decorate the Tree</label
                >
                <div class="progress">
                  <div
                    class="progress-bar bg-success"
                    role="progressbar"
                    style="width: 80%"
                    aria-valuenow="80"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  >
                    80%
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Task 2: Buy Gifts</label>
                <div class="progress">
                  <div
                    class="progress-bar bg-primary"
                    role="progressbar"
                    style="width: 60%"
                    aria-valuenow="60"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  >
                    60%
                  </div>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Task 3: Prepare Food</label>
                <div class="progress">
                  <div
                    class="progress-bar bg-warning"
                    role="progressbar"
                    style="width: 50%"
                    aria-valuenow="50"
                    aria-valuemin="0"
                    aria-valuemax="100"
                  >
                    50%
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <footer class="bg-secondary text-light py-3 text-center">
      <div>
        <span class="me-2">
          <i class="bi bi-stars"></i> Wishing you a prosperous New Year filled
          with joy, love, and success! <i class="bi bi-lightbulb"></i>
        </span>
      </div>
      <div class="mt-2">&copy; 2024 Your Name</div>
    </footer>
  </body>
</html>
