<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      img {
        width: 300px;
        border-radius: 8px;
        margin-bottom: 10px;
      }

      li {
        list-style: none;
        margin: 10px;
        cursor: pointer;
        text-align: center;
      }

      #data {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
        padding: 20px;
      }

      #modal-window {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
      }

      #modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        max-width: 300px;
        text-align: center;
        position: relative;
      }
    </style>
  </head>
  <body>
    <input type="text" id="search" placeholder="Пошук за іменем" />
    <ul id="data"></ul>
    <div id="modal-window">
      <div id="modal-content"></div>
    </div>
    <script src="task1.js"></script>
  </body>
</html>
