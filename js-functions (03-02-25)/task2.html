<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personalized Masks for a Party</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Personalized Masks for a Party</h1>

    <form id="maskForm">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />
      <br /><br />
      <label for="maskColor">Mask Color:</label>
      <input type="color" id="maskColor" name="maskColor" required />
      <br /><br />
      <button type="submit">Done!</button>
    </form>

    <div id="maskCards"></div>

    <script src="script-task2.js"></script>
  </body>
</html>
