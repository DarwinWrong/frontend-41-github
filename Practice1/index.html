<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Анімоване меню та картки</title>
    <style>
        :root {
          --main-color: #333;
          --menu-color: #222;
          --link-color: #fff;
          --tips-color: #c5f077;
        }
      
        body {
          margin: 0;
          padding: 0;
          font-family: Arial, sans-serif;
          background-color: var(--main-color);
          color: var(--link-color);
        }
      
        .animated-menu {
          background: var(--menu-color);
          padding: 10px 0;
          position: sticky;
          top: 0;
          z-index: 100;
        }
      
        .animated-menu ul {
          list-style: none;
          display: flex;
          justify-content: center;
          padding: 0;
          margin: 0;
        }
      
        .animated-menu ul li {
          margin: 0 20px;
        }
      
        .animated-menu ul li a {
          text-decoration: none;
          color: var(--link-color);
          font-size: 18px;
          position: relative;
          padding: 5px 10px;
          transition: color 0.3s;
        }
      
        .animated-menu ul li a:hover {
          color: var(--tips-color);
        }
      
        .animated-menu ul li a::after {
          content: attr(title);
          position: absolute;
          bottom: -25px;
          left: 50%;
          transform: translateX(-50%);
          background: var(--tips-color);
          padding: 3px 5px;
          border-radius: 3px;
          font-size: 14px;
          color: var(--menu-color);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s;
        }
      
        .animated-menu ul li a:hover::after {
          opacity: 1;
        }
      
        .product-cards {
          display: flex;
          justify-content: space-around;
          flex-wrap: wrap;
          padding: 20px;
          gap: 20px;
        }
      
        .card {
          background: rgba(255, 255, 255, 0.1);
          border-radius: 8px;
          padding: 15px;
          text-align: center;
          width: 300px;
          transition: transform 0.3s, box-shadow 0.3s;
        }
      
        .card:hover {
          transform: translateY(-10px);
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
      
        .card img {
          width: 100%;
          height: 200px;
          object-fit: cover;
          border-radius: 5px;
          transition: transform 0.5s;
        }
      
        .card img:hover {
          transform: scale(1.1);
        }
      
        .card h3 {
          margin: 15px 0 10px;
        }
      
        .card p {
          font-size: 14px;
        }
      
        @media (max-width: 600px) {
          .animated-menu ul {
            flex-direction: column;
            align-items: center;
          }
      
          .animated-menu ul li {
            margin: 10px 0;
          }
      
          .product-cards {
            flex-direction: column;
            align-items: center;
          }
      
          .card {
            width: 90%;
          }
        }
      </style>      
  </head>
  <body>
    <nav class="animated-menu">
      <ul>
        <li><a href="#" title="Перейти на головну">Головна</a></li>
        <li><a href="#" title="Дізнатися про нас">Про нас</a></li>
        <li><a href="#" title="Переглянути послуги">Послуги</a></li>
        <li><a href="#" title="Зв'язатися з нами">Контакти</a></li>
      </ul>
    </nav>

    <section class="product-cards">
      <div class="card">
        <img src="images/st-1.webp" alt="Товар 1" title="Деталі товару 1" />
        <h3>Star Wars Toys</h3>
        <p>Опис товару 1.</p>
      </div>
      <div class="card">
        <img src="images/st-2.webp" alt="Товар 2" title="Деталі товару 2" />
        <h3>Homeware</h3>
        <p>Опис товару 2.</p>
      </div>
      <div class="card">
        <img src="images/st-3.webp" alt="Товар 3" title="Деталі товару 3" />
        <h3>Star Wars Collectibles</h3>
        <p>Опис товару 3.</p>
      </div>
    </section>
  </body>
</html>
