<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Menu and Cards</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <nav class="fixed-menu">
            <ul>
                <li><a href="#">Головна</a></li>
                <li><a href="#">Про нас</a></li>
                <li><a href="#">Послуги</a></li>
                <li><a href="#">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="cards">
            <div class="card">
                <div class="image-container">
                    <img src="img/1-toys.png" alt="Star Wars Toys">
                    <div class="tooltip">Деталі товару 1</div>
                </div>
                <h3>Star Wars Toys</h3>
                <p>Опис товару 1.</p>
            </div>

            <div class="card">
                <div class="image-container">
                    <img src="img/2-toys.png" alt="Homeware">
                    <div class="tooltip">Деталі товару 2</div>
                </div>
                <h3>Homeware</h3>
                <p>Опис товару 2.</p>
            </div>

            <div class="card">
                <div class="image-container">
                    <img src="img/3-toys.png" alt="Star Wars Collectibles">
                    <div class="tooltip">Деталі товару 3</div>
                </div>
                <h3>Star Wars Collectibles</h3>
                <p>Опис товару 3.</p>
            </div>
        </section>
    </main>
</body>
</html>
