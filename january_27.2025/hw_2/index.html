<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

<div class="container">
    <h1>Оберіть завдання</h1>
    
    <div id="task4-container">
        <h2>Завдання 4: Циклічна кухня</h2>
        <button onclick="task4()">Показати рецепт омлету</button>
    </div>

    <div id="task5-container">
        <h2>Завдання 5: Функція-привітання</h2>
        <input type="text" id="nameInput" placeholder="Ваше ім'я">
        <input type="number" id="ageInput" placeholder="Ваш вік">
        <button onclick="task5()">Привітати</button>
    </div>

    <div id="task6-container">
        <h2>Завдання 6: Аргументи на вечірці</h2>
        <input type="text" id="guestsInput" placeholder="Введіть імена гостей через кому">
        <button onclick="task6()">Запланувати вечірку</button>
    </div>

    <div class="output" id="output">
        <p>Результати завдання будуть тут...</p>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
