<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

<div class="container">
    <h1>Оберіть завдання</h1>
    
    <div id="task1-container">
        <h2>Завдання 1: Цикл у супермаркеті</h2>
        <p>Введіть продукти через кому:</p>
        <input type="text" id="productsInput" placeholder="Наприклад: хліб, молоко, яблука">
        <button onclick="task1()">Додати в кошик</button>
    </div>
    
    <div id="task2-container">
        <h2>Завдання 2: Математична фабрика</h2>
        <p>Введіть число для таблиці множення:</p>
        <input type="number" id="numberInput" placeholder="Введіть число">
        <button onclick="task2()">Показати таблицю множення</button>
    </div>

    <div class="output" id="output">
        <p>Результати завдання будуть тут...</p>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
