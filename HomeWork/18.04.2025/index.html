<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="quiz-over-modal">
      <div class="content">
        <h1>Гарний результат!</h1>
        <p>
          Ти відповів на
          <span id="correct-answer"></span>
          з
          <span id="number-of-all-questions2"></span>
          запитань.
        </p>
        <button id="btn-try-again">Спробуй знову</button>
      </div>
    </div>

    <div class="quiz-container">
      <div class="question-number">
        <h3>
          Питання
          <span id="number-of-question"></span>
          <span id="number-of-all-questions"></span>
        </h3>
      </div>
      <div id="question"></div>
      <div class="options">
        <div class="option option1" data-id="0"></div>
        <div class="option option2" data-id="1"></div>
        <div class="option option3" data-id="2"></div>
        <div class="option option4" data-id="3"></div>
      </div>
      <div class="button">
        <button id="btn-next">Далі</button>
      </div>
      <div id="answer-tracker"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
