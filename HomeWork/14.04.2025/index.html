<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <!-- Завдання 1 -->
    <div class="inputBox">
      <p>Enter your name(name can`t conyain digits):</p>
      <input type="text" id="intName" placeholder="Your name" />
    </div>
    <!-- Завдання 2 -->
    <div class="modal_window">
      <button class="open_btn" id="openBtn">Open modal</button>
      <div class="modal unvisible" id="modal">
        <p>Hello from Modal Window!</p>
        <button class="close_btn" id="closeBtn">Close</button>
      </div>
    </div>
    <!-- Завдання 4 -->
    <div class="traffic-light">
      <div id="red" class="light"></div>
      <div id="yellow" class="light"></div>
      <div id="green" class="light"></div>
    </div>
    <button onclick="nextColor()">Next</button>

    <!-- Завдання 5 -->
    <ul id="bookList">
      <li>Кобзар — Тарас Шевченко</li>
      <li>Тіні забутих предків — Михайло Коцюбинський</li>
      <li>Захар Беркут — Іван Франко</li>
      <li>Місто — Валер'ян Підмогильний</li>
      <li>Чорна рада — Пантелеймон Куліш</li>
    </ul>

    <script src="./main.js"></script>
  </body>
</html>
