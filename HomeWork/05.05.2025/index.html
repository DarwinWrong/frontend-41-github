<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }

      #search {
        margin-bottom: 20px;
        padding: 10px;
        width: 100%;
        max-width: 400px;
      }

      #booklist {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

      .bookItem {
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 10px;
        width: calc(33.333% - 20px);
      }

      #pagination {
        margin-top: 20px;
      }

      #pagination button {
        margin: 0 5px;
        padding: 5px 10px;
      }
    </style>
  </head>
  <body>
    <input type="text" id="search" placeholder="Пошук" />
    <div id="booklist"></div>
    <div id="pagination"></div>
    <script src="main.js"></script>
  </body>
</html>
