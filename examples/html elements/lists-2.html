<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists</title>
  </head>
  <body>
    <h3>Списки визначень:</h3>
    <dl>
      <dt>Термін 1</dt>
      <dd>Визначення 1</dd>
      <dt>Термін 2</dt>
      <dd>Визначення 2</dd>
    </dl>

    <hr />

    <h3>Випадаючий список:</h3>
    <label for="cars">Select car:</label>
    <select name="cars" id="cars">
      <option value="car 1">car 1</option>
      <option value="car 2">car 2</option>
      <option value="car 3" selected>car 3</option>
    </select>

    <label for="cars">Виберіть автомобіль:</label>
    <select id="cars" name="cars" multiple>
      <option value="volvo">Volvo</option>
      <option value="saab" selected>Saab</option>
      <option value="mercedes">Mercedes</option>
      <option value="audi">Audi</option>
    </select>

    <hr />

    <h3>Список опцій:</h3>
    <label for="fruits">Select fruits:</label>
    <input type="list" list="fruits" />
    <datalist id="fruits" name="fruits">
      <option value="apple" />
      <option value="orange" />
      <option value="berry" />
    </datalist>

    <label for="browser">Виберіть браузер:</label>
    <input list="browsers" id="browser" name="browser" />
    <datalist id="browsers">
      <option value="Chrome"></option>
      <option value="Firefox"></option>
      <option value="Safari"></option>
      <option value="Edge"></option>
      <option value="Opera"></option>
    </datalist>
  </body>
</html>
