<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Header</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
    }

    header {
      width: 100%;
      height: 156px;
      position: absolute;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 0 40px 0 20px;
      z-index: 100;
    }

    header img {
      width: 186px;
      height: 78px;
      margin: 38px auto 40px 0;
    }

    nav {
      display: flex;
      flex-direction: row;
      height: 100%;
      max-height: 54px;
    }

    .navigation {
      list-style: none;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 44px;
    }

    .navigation li {
      padding: 0 21px;
    }

    .navigation li a {
      color: white;
      text-decoration: none;
    }

    form {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    form [type="email"],
    [type="submit"] {
      padding: 19px 40px;
      border-radius: 30px;
      /*border-color: transparent;*/
      border: none;
    }

    form [type="email"] {
      max-width: 273px;
      margin-right: 12px;
    }

    form [type="submit"] {
      max-width: 141px;
      color: red;
    }

    .banner {
      position: relative;
      padding-top: 156px;
      height: 949px;
      background: linear-gradient(45deg, #ef2779 0%, #7834be 100%);
    }

    .banner img {
      width: 100%;
      position: absolute;
      bottom: 0;
      z-index: 10;
    }
  </style>
  <body>
    <header>
      <img src="logo.png" alt="logo" />
      <nav>
        <ul class="navigation">
          <li><a href="#" rel="noopener, noreffer">fewfwefg</a></li>
          <li><a href="#" rel="noopener, noreffer">fewfwefg</a></li>
          <li><a href="#" rel="noopener, noreffer">fewfwefg</a></li>
          <li><a href="#" rel="noopener, noreffer">fewfwefg</a></li>
          <li><a href="#" rel="noopener, noreffer">fewfwefg</a></li>
        </ul>
        <form action="connect.php" method="post">
          <input type="email" value="email" required />
          <input type="submit" value="send" />
        </form>
      </nav>
    </header>
    <main>
      <section class="banner">
        <img class="bottom" src="images/banner-bottom.png" alt="image" />
      </section>
    </main>
  </body>
</html>
