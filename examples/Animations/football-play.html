<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>football</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      main {
        margin-top: 100px;
        width: 100vw;
        height: 500px;
        /*display: flex;*/
        /*align-items: end;*/
      }

      .player {
        display: inline-block;
        width: 60px;
        height: 80px;
        background: black;
        animation: player-move 3s ease-in 1s forwards,
          player-kick 0.3s ease-in 4s forwards;
      }

      .ball {
        display: inline-block;
        width: 30px;
        height: 30px;
        border: 2px dashed black;
        border-radius: 50%;
        background: rgb(90, 154, 214);
        margin-left: 40%;
        animation: ball-move 2s ease-in 4.5s forwards,
          shake 2s ease 6.5s infinite;
      }

      .vorotar {
        /*display: inline-block;*/
        width: 60px;
        height: 80px;
        background: red;
        float: right;
        /*order: 1;*/
        /*margin-right: 200px;*/
        animation: vorotar-move 3s ease-in 1s forwards;
      }

      .vorota {
        width: 200px;
        height: 100px;
        display: flex;
        float: right;
        /*order: 2;*/
        margin-top: -20px;
      }

      .left-bar,
      .right-bar {
        width: 30px;
        height: 100%;
        background: black;
      }

      .vorota .left-bar {
      }

      .vorota .crossbar {
        width: 100%;
        height: 30px;
        background: black;
      }

      .vorota .right-bar {
      }

      @keyframes vorotar-move {
        0% {
          transform: translateX(0);
        }
        20% {
          transform: translate(-3vw, -20px);
        }
        35% {
          transform: translate(-5vw, 0px);
        }
        50% {
          transform: translate(-8vw, -20px);
        }
        65% {
          transform: translate(-11vw, 0px);
        }
        80% {
          transform: translate(-16vw, -20px);
        }
        100% {
          transform: translate(-20vw, 0px);
        }
      }

      @keyframes player-move {
        0% {
          transform: translateX(0);
        }
        20% {
          transform: translate(5vw, -20px);
        }
        35% {
          transform: translate(12vw, 0px);
        }
        50% {
          transform: translate(17vw, -20px);
        }
        65% {
          transform: translate(24vw, 0px);
        }
        80% {
          transform: translate(30vw, -20px);
        }
        100% {
          transform: translate(40vw, 0px);
        }
      }
      @keyframes player-kick {
        0% {
          transform: translate(39vw, 0px); /* Початковий стан удару */
          /*transform-origin: 0 100%;*/
        }
        100% {
          transform: translate(39vw, 0px) rotate(-30deg); /* Обертання ноги під час удару */
          /*transform-origin: 0 100%;*/
        }
      }

      @keyframes ball-move {
        0% {
          transform: translateX(0) skew(10deg);
        }
        20% {
          transform: translate(5vw, -50px) rotate(20deg) skew(5deg);
        }
        30% {
          transform: translate(10vw, -120px) rotate(100deg) skew(0deg);
        }
        40% {
          transform: translate(12vw, -140px) rotate(120deg) skew(15deg);
        }
        50% {
          transform: translate(17vw, 0px) rotate(20deg) skew(0deg);
        }
        60% {
          transform: translate(24vw, -50px) rotate(20deg);
        }
        70% {
          transform: translate(30vw, -120px) rotate(20deg);
        }
        80% {
          transform: translate(30vw, -120px) rotate(20deg);
        }
        100% {
          transform: translate(45vw, 0px) rotate(0deg) skew(0);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateY(0) translateX(45vw);
        }

        10%,
        30%,
        50%,
        70% {
          transform: translateY(-8px) translateX(45vw);
        }

        20%,
        40%,
        60% {
          transform: translateY(8px) translateX(45vw);
        }

        80% {
          transform: translateY(6.4px) translateX(45vw);
        }

        90% {
          transform: translateY(-6.4px) translateX(45vw);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="player"></div>
      <div class="ball"></div>
      <div class="vorotar"></div>
      <div class="vorota">
        <div class="left-bar"></div>
        <div class="crossbar"></div>
        <div class="right-bar"></div>
      </div>
    </main>
  </body>
</html>
