<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <p>Most calendars are designed for teams.<br>Slate is designed for freelancers</p>
        
        <div class="contact-section">
            <div class="form-container">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea rows="5" placeholder="Your Message" required></textarea>
                <button type="submit">Send</button>
            </div>
            
            <div class="info-container">
                <p class="icon"><i class="fas fa-map-marker-alt"></i> 6386 Spring St Undefined Anchorage,<br> Georgia 12473 United States</p>
                <p class="icon"><i class="fas fa-phone-alt"></i> (843) 555-0130</p>
                <p class="icon"><i class="fas fa-envelope"></i> willie.jennings@example.com</p>
                <div class="social-links">
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
