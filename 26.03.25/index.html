<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Персонажі</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; }
        .characters { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .character { cursor: pointer; border: 1px solid #ccc; padding: 10px; width: 150px; }
        .character img { width: 100%; height: auto; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); }
        .modal-content { background: white; padding: 20px; margin: 10% auto; width: 300px; text-align: left; }
        .close { cursor: pointer; color: red; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Star Wars Персонажі</h1>
        <input type="text" id="search" placeholder="Фільтрувати персонажів...">
        <div class="characters" id="characters"></div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2 id="modalName"></h2>
            <img id="modalImage" src="" alt="">
            <p><strong>Стать:</strong> <span id="modalGender"></span></p>
            <p><strong>Раса:</strong> <span id="modalSpecies"></span></p>
            <p><strong>Висота:</strong> <span id="modalHeight"></span> см</p>
        </div>
    </div>

    <script>
        const charactersContainer = document.getElementById('characters');
        const searchInput = document.getElementById('search');
        const modal = document.getElementById('modal');
        const closeModal = document.getElementById('closeModal');
        let characters = [];

        async function fetchCharacters() {
            const response = await fetch('https://akabab.github.io/starwars-api/api/all.json');
            characters = await response.json();
            displayCharacters(characters);
        }

        function displayCharacters(list) {
            charactersContainer.innerHTML = '';
            list.forEach(character => {
                const div = document.createElement('div');
                div.classList.add('character');
                div.innerHTML = `
                    <img src="${character.image}" alt="${character.name}">
                    <p>${character.name}</p>
                `;
                div.addEventListener('click', () => openModal(character));
                charactersContainer.appendChild(div);
            });
        }

        function openModal(character) {
            document.getElementById('modalName').innerText = character.name;
            document.getElementById('modalImage').src = character.image;
            document.getElementById('modalGender').innerText = character.gender;
            document.getElementById('modalSpecies').innerText = character.species;
            document.getElementById('modalHeight').innerText = character.height;
            modal.style.display = 'block';
        }

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filteredCharacters = characters.filter(character =>
                character.name.toLowerCase().includes(query) ||
                character.species?.toLowerCase().includes(query) ||
                character.gender?.toLowerCase().includes(query)
            );
            displayCharacters(filteredCharacters);
        });

        fetchCharacters();
    </script>
</body>
</html>
