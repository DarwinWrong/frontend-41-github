<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання</title>
    <link rel="stylesheet" href="style/style.css"> 
</head>
<body>

    <h2>Завдання 1: Відкриваємо двері</h2>
    <button id="doorButton">Відкрити двері</button>

    <h2>Завдання 2: Театр акторів</h2>
    <p>Поточна роль: <span id="actorRole">Гамлет</span></p>
    <input type="text" id="newRole" placeholder="Введіть нову роль">
    <button id="changeRoleButton">Змінити роль</button>

    <h2>Завдання 3: Список домашніх тварин</h2>
    <h3>Список домашніх тварин:</h3>
    <ul id="petsList">
        <li>Кіт</li>
        <li>Собака</li>
    </ul>
    <input type="text" id="petName" placeholder="Введіть ім'я тварини">
    <button id="addPetButton">Додати тварину</button>

    <script src="script/scritp.js"></script>
</body>
</html>
