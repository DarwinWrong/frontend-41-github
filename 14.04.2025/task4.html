<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #eef2f3;
      }

      .traffic-light {
        width: 100px;
        height: 300px;
        background-color: #333;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 0 10px #000;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }

      .light {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: gray;
      }

      button {
        margin-top: 30px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="traffic-light">
      <div id="red" class="light"></div>
      <div id="yellow" class="light"></div>
      <div id="green" class="light"></div>
    </div>
    <button onclick="nextColor()">Next</button>

    <script>
      let index = 0;
      const colors = ["red", "yellow", "green"];

      function nextColor() {
        document.getElementById("red").style.backgroundColor = "gray";
        document.getElementById("yellow").style.backgroundColor = "gray";
        document.getElementById("green").style.backgroundColor = "gray";

        document.getElementById(colors[index]).style.backgroundColor =
          colors[index];
        index = (index + 1) % colors.length;
      }
      nextColor();
    </script>
  </body>
</html>
