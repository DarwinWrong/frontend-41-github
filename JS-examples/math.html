<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math</title>
  </head>
  <body>
    <script>
      console.log('math:', Math);
      console.log('math.PI:', Math.PI); // 3.14159...

      console.log('25', Math.sqrt(25)); // 5

      console.log('max', Math.max(10, 2, 14, 5)); // 14
      console.log('min', Math.min(10, 2, 14, 5)); // 2

      console.log('round 0,49', Math.round(0.49)); // округлення вниз 0
      console.log('round 0,51', Math.round(0.51)); // округлення вгору 1

      console.log('round 0,49', Math.floor(0.49)); // 0
      console.log('round 0,51', Math.floor(0.51)); // 0
      console.log('round 1,5', Math.floor(1.9)); // 1

      console.log('random', Math.random());

      const randomNumber_0_9 = Math.floor(Math.random() * 10);
      console.log('randomNumber_0_9', randomNumber_0_9); // 0-9
      const randomNumber_1_10 = Math.floor(Math.random() * 10) + 1;
      console.log('randomNumber_1_10', randomNumber_1_10); // 1-10
    </script>
  </body>
</html>
