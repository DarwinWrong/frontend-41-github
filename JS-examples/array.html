      var arr = [1, 2, 3, 4, 5];

      // ===========================================
      var superHeroes = ["Superman", "Batman", "Spiderman"];
      var dancingHeroes = superHeroes.map(function (hero) {

      var arr = [1, 2, 3, 4, 5, 6, 7, 8];

      });

      var found = arr.filter(function (number) {
