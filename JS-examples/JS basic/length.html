<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>length</title>
</head>
<body>
<div>1</div>
<div>2</div>
<script>
    var num = 12345; //undefined
    console.log(num.length); // 5
    console.log(num.toString().length); // 5

// ================================================================
// ================================================================
    let arr = [10, 20, 30, 40];
    console.log(arr.length); // 4

// ================================================================
// ================================================================
    arr.length = 2;
    console.log(arr); // [10, 20]

    arr.length = 5;
    console.log(arr); // [10, 20, <3 empty slots>]

    // ================================================================
    // ================================================================
    let str = "Hello";
    console.log(str.length); // 5

    str.length = 2;
    console.log(str.length); // 5 (не змінилося)

    // ================================================================
    // ================================================================
    function myFunc(a, b, c) {}
    console.log(myFunc.length); // 3

    function example(a, b = 10, ...rest) {}
    console.log(example.length); // 1 (рахується тільки `a`)

    // ================================================================
    // ================================================================
    let obj = { a: 1, b: 2, c: 3 };
    console.log(Object.keys(obj).length); // 3

    // ================================================================
    // ================================================================
    let elements = document.querySelectorAll("div");
    console.log(elements.length); // Кількість знайдених <div>
</script>
</body>
</html>
