<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
  </head>
  <body>
    <script>
      console.log(typeof 0); // "number"
      console.log(typeof new Number(0)); // "object"!
      let num = Number('123'); // конвертує рядок в число
    </script>

    <button id="banner" class="banner">Banner</button>

    <script>
      function greet() {
        console.log('Привіт!');
      }

      console.log(typeof greet === 'function'); // true, бо це функція
      console.log(typeof greet === 'object'); // false, бо це не об'єкт
      console.log(greet instanceof Function); // true
      console.log(greet instanceof Object); // true
      // ================================================================
      // ================================================================
      const blueText = document.getElementsByTagName('button');
      const content = document.getElementsByClassName('button');
      console.log(blueText instanceof HTMLElement); // true
      console.log(content instanceof HTMLCollection); // true

      // ================================================================
      // obj instanceof Class
      // ================================================================
      class Animal {}
      class Dog extends Animal {}

      const dog = new Dog();
      console.log(dog instanceof Dog); // true
      console.log(dog instanceof Animal); // true (бо Dog наслідується від Animal)
      console.log(dog instanceof Object); // true (усі об'єкти в JS наслідуються від Object)
    </script>
  </body>
</html>
