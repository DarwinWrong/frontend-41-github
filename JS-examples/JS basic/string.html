<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Object</title>
</head>
<body>

<!--є рядок і нам потрібно його конвертувати в масив, розбивши на елементи масиву на основі якогось роздільника-->
<script>
    var str = "apple, onion, strawberry";
    // розбиваємо на підставі,
    // у масиві буде три елементи: apple, onion, strawberry
    var arr = str.split(',');
    console.log(arr[0]); // apple на екрані
</script>
<!--Масив має зворотний метод join. Він використовується для конвертування масиву в рядок-->
<script>
    var arr = ["bmw", "audi", "opel"];
    // створюємо рядок, як розділовий символ між елементами масиву вказуємо *
    var str = arr.join("*");
    console.log(str); // bmw*audi*opel
    // якщо не вказати роздільник, то буде використано ,
    var str2 = arr.join();
    console.log(str2); // bmw, audi, opel
</script>

<!--Внутрішнім форматом зберігання рядків у JavaScript є Unicode. І при цьому абслютно неважливо, -->
<!--яке у вас кодування вашої сторінки. Ви можете включати спеціальні символи у свій рядок-->
<!--Не можна змінити символ за індексом, або довжину length, але можна змінити весь рядок через присвоєння-->
<script>
// КОДУВАННЯ РЯДКІВ
    // \t - табуляція
    var str = "Sun\t is going \\down";
    console.log(str); // Sun is going \down\
    // для вставки лапок у рядок треба використовувати \"
    var str2 = "Yes \"\" ";
    console.log(str2); // на екрані Yes ""

// ДОСТУП ДО ЕЛЕМЕНТА
    var str="trees and fruits";
    console.log(str[0]); // на екрані t
    console.log(str[4]); // на екрані s

// КОНКАТЕНАЦІЯ
    var first = "boat", second = "river";
    var result = first + " and " + second;
    console.log(result); // boat and river
    var result = `${first} and ${second}`;
    console.log(result); // boat and river
</script>

<!--Властивості та методи String-->
<script>
    var str = "gold";
    console.log(str.length); // 4

    // при зверненні до неінуючого індексу charAt повертає порожній рядок, а [ ] значення undefined
    console.log(str.charAt(0)); // g
    console.log(str.charAt(15)); // порожній рядок
    console.log(str[15]);// undefined


    var lowerStr = str.toLowerCase();
    var upperStr = str.toUpperCase();
    console.log('lowerStr', lowerStr, 'upperStr', upperStr)


    var str = "earth and sun";
    var index = str.indexOf("sun"); // значення індексу дорівнює 10
    console.log(index);
    index = str.indexOf("moon"); // значення індексу дорівнює -1 тому що moon немає в рядку
    console.log(index);


    var str = "test it is test sun test no";
    var counter = 0;
    var wordTForFind = "test";
    var index = str.indexOf(wordTForFind);
    while (index != -1) {
        counter++;
        index = str.indexOf(wordTForFind, index+1);
    }
    console.log(counter); // 3


    // Методи substr, substring використовуються для отримання рядка substring(start, [end])
    // end - необов'язковий параметр, який можна опустити
    // Якщо end не вказано, то повертаємо підрядок до кінця рядка
    // не підтримує негативні індекси
    var str = "Some value";
    var newStr = str.substring(2);
    console.log(newStr); // me value
    newStr = str.substring(1,3);
    console.log(newStr); // om

    // slice(start, end) – найкращий вибір, бо підтримує негативні індекси.
    var str = "Hello, world!";
    var newStr = str.slice(2); // Від другого індексу до кінця
    console.log(newStr); // "llo, world!"


    // Якщо потрібно отримати певну довжину
    // починаємо з символу під індексом 2, беремо до індексу 7, не включаючи його.

    // Особливості slice():
    // Якщо end не вказано, бере всі символи до кінця рядка.
    // Підтримує негативні індекси: slice(-5, -1) означає "візьми 5 символів від кінця, не включаючи останній".
    let newStr2 = str.slice(2, 2 + 5); // Аналог str.substr(2, 5),
    console.log(newStr2); // "llo, "

    // Особливості substring():
    // Не підтримує негативні індекси (їх автоматично перетворює на 0).
    let newStr3 = str.substring(2, 7); // Аналогічно str.slice(2, 7)
    console.log(newStr3); // "llo, "
    // Якщо start більше за end, вони просто міняються місцями:
    // У slice() такого не відбувається – якщо start > end, результат буде порожнім.
    console.log("Hello".substring(3, 1)); // "el" (фактично substring(1, 3))

</script>

<script>
    console.log(str.toUpperCase()); // "ПРИВІТ"
    console.log(str.toLowerCase()); // "привіт"
    console.log(str.indexOf("и")); // 2
    console.log(str.includes("віт")); // true
    console.log(str.slice(1, 4)); // "рив"
</script>
</body>
</html>
