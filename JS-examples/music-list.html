    <script>
      /**
       * Об'єкт для роботи з UI-елементами
       * @property {HTMLElement} song - Поле введення назви пісні
       * @property {HTMLElement} duration - Поле введення тривалості пісні
       * @property {HTMLElement} btnAddSong - Кнопка для додавання пісні
       * @property {HTMLElement} playlist - Список відображення пісень
       * @property {HTMLElement} totalDuration - Поле загальної тривалості
       * @property {HTMLElement} search - Поле для пошуку
       * @property {HTMLElement} btnSortByDuration - Кнопка сортування за тривалістю
       * @property {HTMLElement} btnSortByName - Кнопка сортування за назвою
       * @property {HTMLElement} btnTotalDuration - Кнопка підрахунку загальної тривалості
       * @property {HTMLElement} btnClearList - Кнопка очищення списку
       * @property {HTMLElement} btnSearch - Кнопка пошуку пісні
       */
      const UI = {
        song: document.getElementById("song"),
        duration: document.getElementById("duration"),
        btnAddSong: document.getElementById("add-song"),
        playlist: document.getElementById("playlist"),
        totalDuration: document.getElementById("total-duration"),
        search: document.getElementById("search"),
        btnSortByDuration: document.getElementById("sort-by-duration"),
        btnSortByName: document.getElementById("sort-by-name"),
        btnTotalDuration: document.getElementById("count-total-duration"),
        btnClearList: document.getElementById("clear-list"),
        btnSearch: document.getElementById("search-btn"),
      };

      let playlistArray = [];

      /**
       * Фабрика для створення об'єкта пісні
       * @param {string} name - Назва пісні
       * @param {number} duration - Тривалість пісні
       * @returns {Object} Об'єкт пісні { name, duration }
       */
      const createSong = (name, duration) => ({ name, duration });

      /**
       * Оновлює відображення списку пісень
       */
      const updatePlaylist = () => {
        UI.playlist.innerHTML = "";
        playlistArray.forEach((song) => {
          const li = document.createElement("li");
          li.id = `li-${song.name}`;
          li.setAttribute("name", song.name);
          li.textContent = `${song.name} - ${song.duration}`;

          const delButton = document.createElement("button");
          delButton.setAttribute("song", song.name);
          delButton.textContent = "Delete";
          li.appendChild(delButton);

          UI.playlist.appendChild(li);
        });
      };

      /**
       * Видаляє пісню зі списку
       * @param {string} songName - Назва пісні для видалення
       */
      const delSong = (songName) => {
        playlistArray = playlistArray.filter((song) => song.name !== songName);
        updatePlaylist();
      };

      /**
       * Отримує інформацію про пісню з полів введення
       * @returns {Object} Об'єкт пісні { songName, songDuration }
       */
      const getSongInfo = () => ({
        songName: UI.song.value.trim(),
        songDuration: UI.duration.value.trim(),
      });

      /**
       * Перевіряє правильність введених даних
       * @param {Object} songInfo - Об'єкт пісні
       * @returns {boolean} true якщо дані валідні, інакше false
       */
      const checkSongData = (songInfo) => {
        if (!songInfo.songName || !songInfo.songDuration) {
          alert("Please fill in all fields");
          return false;
        }
        if (playlistArray.some((song) => song.name === songInfo.songName)) {
          alert("This song is already in the playlist");
          return false;
        }
        return true;
      };

      /**
       * Обробляє подію додавання пісні
       */
      UI.btnAddSong.addEventListener("click", () => {
        const songInfo = getSongInfo();
        if (!checkSongData(songInfo)) return;

        playlistArray.push(
          createSong(songInfo.songName, songInfo.songDuration)
        );
        updatePlaylist();
      });

      /**
       * Сортує список пісень за назвою
       */
      UI.btnSortByName.addEventListener("click", () => {
        playlistArray.sort((a, b) => a.name.localeCompare(b.name));
        updatePlaylist();
      });

      /**
       * Сортує список пісень за тривалістю
       */
      UI.btnSortByDuration.addEventListener("click", () => {
        playlistArray.sort((a, b) => a.duration - b.duration);
        updatePlaylist();
      });

      /**
       * Підраховує загальну тривалість пісень
       */
      UI.btnTotalDuration.addEventListener("click", () => {
        const total = playlistArray.reduce(
          (acc, song) => acc + parseInt(song.duration),
          0
        );
        UI.totalDuration.textContent = total;
      });

      /**
       * Очищає список пісень
       */
      UI.btnClearList.addEventListener("click", () => {
        playlistArray = [];
        updatePlaylist();
        UI.totalDuration.textContent = "0";
      });

      /**
       * Пошук пісні за назвою
       */
      UI.btnSearch.addEventListener("click", () => {
        const searchValue = UI.search.value.trim();

        document
          .querySelectorAll("li")
          .forEach((li) => li.classList.remove("activeSong"));

        const song = playlistArray.find((s) => s.name === searchValue);
        if (!song) {
          alert("Song not found");
          return;
        }

        // Виносим знайдену пісню на верх
        playlistArray.sort(function (a, b) {
          return a.name === searchValue ? -1 : 1;
        });

        // Оновлюємо список
        updatePlaylist();

        // Активуєм елемент
        document
          .getElementById(`li-${searchValue}`)
          .classList.add("activeSong");
      });

      /**
       * Делегування подій для видалення пісень
       */
      UI.playlist.addEventListener("click", (event) => {
        if (event.target.tagName === "BUTTON") {
          delSong(event.target.getAttribute("song"));
        }
      });
    </script>
