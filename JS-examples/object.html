<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects</title>
  </head>
  <body>
    <script>
      var student = new Object();
      student.name = "John";
      student["this is age"] = 25;
      student.surname = "Ivanov";

      console.log("student:", student);

      var plant = {};
      plant.name = "Roshen";
      console.log("plant:", plant);

      var car = {
        model: "Tesla",
        year: 2020,
        color: "red",
        price: 50000,
      };

      console.log("object == object", {} == {});
      var sportCar = Object.create(car);
      sportCar.maxSpeed = 300;

      var sportCar2 = Object.create({});
      var sportCar3 = Object.create(null);

      console.log("Object.create:", sportCar2, sportCar3);

      console.log("car:", car);
      console.log("sportCar:", sportCar, sportCar.year);
    </script>

    <script>
      var user = {
        name: "Will",
        age: 25,
        isAdmin: false,
        isVehicle: true,
        isPlanet: true,
      };

      var admin = user;
      console.log(admin.name);

      admin.name = "Alice";

      console.log("user.name", user.name);
      console.log("admin.name", admin.name);

      delete user.isVehicle;
      delete user["isPlanet"];
      console.log("user:", user);

      if ("name" in user) {
        console.log("user has name");
      } else {
        console.log("user has no name");
      }
    </script>
    <!-- ======================================================================================= -->
    <!-- ======================================================================================= -->
    <script>
      // ACCORDION
      document.querySelectorAll(".accordion-button").forEach((button) => {
        button.addEventListener("click", () => {
          const content = button.nextElementSibling;
          content.style.display =
            content.style.display === "block" ? "none" : "block";
        });
      });
    </script>
    <!-- ======================================================================================= -->
    <!-- ======================================================================================= -->
    <script>
      if ("name" in user) {
        console.log("user has name");
      } else {
        console.log("user has no name");
      }
      // ===========================================
      // fromEntries() - create an object from an array
      // ===========================================
      var arr = [
        ["name", "John"],
        ["age", 25],
        ["isAdmin", false],
      ];
      var obj = Object.fromEntries(arr);
      console.log("obj->fromEntries:", obj);
      // ===========================================
      // assign() - copy the values of all enumerable own properties from one or more source objects to a target object
      // ===========================================
      var obj1 = { a: 1, b: 2 };
      var obj2 = { c: 3, d: 4 };
      var obj3 = { e: 5, f: 6 };
      var unionObj = Object.assign({}, obj2, obj3);
      console.log("unionObj->assign:", unionObj);

      // ===========================================
      // hasProperty - check if property exists
      // ===========================================
      var actor = {
        name: "Will",
        age: 25,
      };
      const hasName = actor?.hasOwnProperty("name");
      console.log("hasProperty->actor:", hasName);

      /**
       * Checking if param is exist
       *
       * @param {string} propName - name of the param
       * @param {objects} obj - object that include the param
       * @param {bool} debug - Entry message about param
       * @return {bool} - exist of param
       *
       */
      function checkProp(propName = "", obj, debug = false) {
        let result;
        propName in obj ? (result = true) : (result = false);
        if (debug)
          console.log(`checkProp->propName: ${propName}, result: ${result}`);
        return result;
      }
      checkProp("age", actor, true);
    </script>
  </body>
</html>
