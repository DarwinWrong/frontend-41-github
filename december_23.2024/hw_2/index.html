<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy New Year 2025</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1c1c1c;
      color: white;
    }
    .progress-bar {
      text-align: left;
      padding-left: 5px;
    }
    .navbar-dark .navbar-brand {
      font-size: 1.5rem;
      color: #ffdf00;
    }
  </style>
</head>
<body>
  <header class="py-3 bg-dark">
    <div class="container text-center">
      <h1 class="fw-bold">🎉 Happy New Year 2025! 🎆</h1>
    </div>
  </header>

  <div class="container mt-4">
    <div class="row">
      <div class="col-lg-3">
        <nav class="nav flex-column bg-secondary p-3 rounded">
          <a class="nav-link text-light" href="#">🏠 Home</a>
          <a class="nav-link text-light" href="#tasks">✔ Completed Tasks</a>
          <a class="nav-link text-light" href="#goals">🎯 Goals</a>
          <a class="nav-link text-light" href="#wishes">💌 Wishes</a>
        </nav>
      </div>

      <div class="col-lg-9">
        <div id="carouselExample" class="carousel slide mb-4" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="img/img-1.jpg" class="d-block w-100" alt="Santa 1">
            </div>
            <div class="carousel-item">
              <img src="img/img-2.jpg" class="d-block w-100" alt="Santa 2">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
          </button>
        </div>

        <section id="tasks">
          <h2>Progress of Completed Tasks</h2>
          <div class="mb-3">
            <label>Task 1: Decorate the Tree</label>
            <div class="progress">
              <div class="progress-bar bg-success" style="width: 80%;">80%</div>
            </div>
          </div>
          <div class="mb-3">
            <label>Task 2: Buy Gifts</label>
            <div class="progress">
              <div class="progress-bar bg-info" style="width: 60%;">60%</div>
            </div>
          </div>
          <div class="mb-3">
            <label>Task 3: Prepare Food</label>
            <div class="progress">
              <div class="progress-bar bg-warning" style="width: 50%;">50%</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <footer class="text-center py-3 mt-4 bg-dark">
    <p>🎇 Wishing you a prosperous New Year filled with joy, love, and success! 🎇</p>
    <p>© 2024 Your Name</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
