<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click imitation</title>
  </head>
  <body>
    <style>
      .hidden-checkbox {
        display: none;
      }

      .button {
        display: inline-block;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4caf50;
        color: white;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.1s ease;
      }

      .hidden-checkbox:checked + .button {
        background-color: #388e3c; /* Ефект "активації" */
        transform: scale(0.95); /* Імітація натискання */
      }
    </style>
    <h4>checkbox:checked</h4>
    <label class="clickable">
      <input type="checkbox" class="hidden-checkbox" />
      <span class="button">Click me</span>
    </label>

    <hr />

    <style>
      .btn {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4caf50;
        border: none;
        color: white;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      .btn:active {
        transform: scale(0.95); /* Візуальний ефект натискання */
        background-color: #388e3c;
      }
    </style>
    <h4>:focus</h4>
    <button class="btn">Click me</button>
  </body>
</html>
