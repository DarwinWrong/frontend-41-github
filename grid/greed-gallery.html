<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Адаптивна галерея</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Загальні стилі */
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }

      h1 {
        text-align: center;
        margin: 20px 0;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* Чотири колонки */
        gap: 10px;
        padding: 10px;
      }

      .item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: 8px;
      }

      /* Елементи, що займають більше простору */
      .big {
        grid-column: span 2; /* Займає 2 колонки */
        grid-row: span 2; /* Займає 2 рядки */
      }

      .wide {
        grid-column: span 2; /* Широка картинка на 2 колонки */
      }

      .tall {
        grid-row: span 2; /* Висока картинка на 2 рядки */
      }

      /* ======= Медійні запити для адаптивності ======= */

      /* Малі екрани: 360px */
      @media (max-width: 360px) {
        .gallery {
          grid-template-columns: 1fr; /* Одна колонка */
        }

        .big,
        .wide,
        .tall {
          grid-column: span 1; /* Всі елементи займають всю ширину */
          grid-row: span 1;
        }
      }

      /* Середні екрани: 768px */
      @media (max-width: 768px) {
        .gallery {
          grid-template-columns: repeat(2, 1fr); /* Дві колонки */
        }

        .big,
        .wide,
        .tall {
          grid-column: span 2; /* Всі великі елементи займають дві колонки */
          grid-row: span 1; /* Висота буде обмежена одним рядом */
        }
      }
    </style>
  </head>
  <body>
    <!DOCTYPE html>
    <html lang="uk">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Адаптивна галерея</title>
        <link rel="stylesheet" href="styles.css" />
      </head>
      <body>
        <h1>Адаптивна галерея</h1>
        <div class="gallery">
          <div class="item big" id="item1">
            <img src="https://via.placeholder.com/400x200" alt="Big Image" />
          </div>
          <div class="item wide" id="item2">
            <img src="https://via.placeholder.com/200x100" alt="Wide Image" />
          </div>
          <div class="item tall" id="item3">
            <img src="https://via.placeholder.com/150x300" alt="Tall Image" />
          </div>
          <div class="item">
            <img src="https://via.placeholder.com/150x300" alt="Image 1" />
          </div>
          <div class="item">
            <img src="https://via.placeholder.com/150x300" alt="Image 2" />
          </div>
          <div class="item">
            <img src="https://via.placeholder.com/150x300" alt="Image 3" />
          </div>
          <div class="item">
            <img src="https://via.placeholder.com/300x300" alt="Image 4" />
          </div>
        </div>
      </body>
    </html>
  </body>
</html>
