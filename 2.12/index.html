<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блоки з текстом та картинками</title>
    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .block {
            position: relative;
            width: 300px;
            height: 200px;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        .block img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1s;
        }
        .block .text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            text-align: center;
            z-index: 1;
        }
        .block .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            transition: background-color 0.3s;
            z-index: 2;
        }
        .block:hover .overlay {
            background-color: rgba(0, 0, 0, 0.5);
        }
        .block:hover img {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="block">
            <img src="img/image.jpg" alt="Image 1">
            <div class="overlay"></div>
            <div class="text">Текст 1</div>
        </div>
        <div class="block">
            <img src="img/image.jpg" alt="Image 2">
            <div class="overlay"></div>
            <div class="text">Текст 2</div>
        </div>
        
    </div>
</body>
</html>
