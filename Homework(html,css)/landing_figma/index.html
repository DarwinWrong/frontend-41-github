<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="header_wrapper">
            <div class="logo_container">
                <img class="logo" src="src/images/logo.png" alt="logo">
            </div>
            <div class="menu">
                <img src="src/images/burger.png" alt="" class="burger">
            </div>
        </div>
    </header>
    <main>
        <div class="main_wrapper">
            <div class="text_wrapper">
                <div class="main_header_wrapper">
                    <h2>Lightning fast prototyping</h2>
                </div>
                <div class="description_wrapper">
                    <h4>Most calendars are designed for teams. Slate is designed for freelancers</h4>
                </div>
            </div>
            <div class="img_wrapper">
                <img src="src/images/screen.png" alt="">
            </div>
            <div class="button_wrapper">
                <button>Try for free</button>
            </div>
        </div>
    </main>
</body>
</html>
