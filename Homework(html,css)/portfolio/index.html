<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      rel="stylesheet"
      href="assets/bootstrap-icons/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-black text-light">
    <header>
      <nav
        class="navbar navbar-expand-md"
        data-bs-theme="dark"
        style="background-color: #000000 !important"
      >
        <div class="container-fluid mx-0 mx-md-4">
          <a class="navbar-brand m-0" href="#">robert garcia</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarText"
            aria-controls="navbarText"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse flex-grow-0 text-end text-lg-start"
            id="navbarText"
          >
            <ul class="navbar-nav mt-4 mt-md-0 mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link px-3 py-2 py-md-4"
                  aria-current="page"
                  href="#"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link px-3 py-2 py-md-4" href="#">Features</a>
              </li>
              <li class="nav-item">
                <a class="nav-link px-3 py-2 py-md-4" href="#">Pricing</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section id="banner" class="mt-4">
        <div class="container">
          <div class="row overflow-hidden">
            <div class="col-md-6">
              <h3 class="text-uppercase">
                hi, i am <br />
                robert garcia.
              </h3>
              <p>
                A Sydney based front-end developer passionate about building
                accessible and user friendly websites.
              </p>
              <div
                class="socials d-flex justify-content-start align-items-center mt-4"
              >
                <button
                  class="btn rounded-5 p-3 me-3 text-uppercase"
                  style="font-size: 1rem; background-color: #d3e97a"
                >
                  Contact Me <i class="bi bi-circle-fill ms-3"></i>
                </button>
                <a
                  href="#"
                  class="c-pointer p-3 me-3 rounded rounded-circle"
                  style="background-color: #222222"
                >
                  <i class="bi bi-linkedin"></i>
                </a>
                <a
                  href="#"
                  class="c-pointer p-3 rounded rounded-circle"
                  style="background-color: #222222"
                >
                  <i class="bi bi-github" style="color: #d3e97a"></i>
                </a>
              </div>
            </div>
            <div class="col-md-6 mt-5 mt-lg-0">
              <img
                class="profile object-fit-contain"
                src="assets/images/photo.png"
                alt="robert garcia photo"
              />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
