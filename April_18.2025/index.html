<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вікторина</title>
  <link rel="stylesheet" href="style/style.css" />
</head>
<body>
  <div class="quiz-container">
    <div id="quiz">
      <h2 id="question-number">Питання 1 з 5</h2>
      <p id="question-text">Питання тут...</p>
      <div id="answer-buttons" class="btn-container"></div>
      <button id="next-btn">Далі</button>
    </div>
  </div>

  <div id="result-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Результат</h2>
      <p id="result-text">Правильних відповідей: 0 з 0</p>
      <button id="retry-btn">Спробувати ще раз</button>
    </div>
  </div>

  <script src="script/main.js"></script>
</body>
</html>
