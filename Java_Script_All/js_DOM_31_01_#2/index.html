<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання з подіями та модальним вікном</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Завдання 1: Робота з подіями в DOM</h2>
    <p class="clickable">Натисни на мене, щоб змінити колір!</p>
    <p class="clickable">Я теж зміню колір при натисканні!</p>
    <p class="clickable">Спробуй натиснути на мене!</p>

    <h2>Завдання 2: Модальне вікно</h2>
    <button id="openModal">Відкрити модальне вікно</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <p>Це модальне вікно.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
