<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        align-items: center;
        justify-content: center;
      }
      #modal-content {
        background: white;
        padding: 20px;
        text-align: center;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <button id="open">Відкрити модальне вікно</button>
    <div id="modal">
      <div id="modal-content">
        <p>Це модальне вікно!</p>
        <button id="close">Закрити</button>
      </div>
    </div>
    <script src="task2.js"></script>
  </body>
</html>
