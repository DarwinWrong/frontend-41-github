<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Портфоліо</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="bg-body-secondary">
      <div class="container">
        <nav class="navbar navbar-expand-md navbar-light py-3">
          <!-- Логотип -->
          <a
            href="/"
            class="navbar-brand d-flex align-items-center text-dark text-decoration-none"
          >
            <i class="bi bi-person fs-1"></i>
          </a>
          <!-- Кнопка-гамбургер -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- Меню -->
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a href="#" class="nav-link text-black">Про мене</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link text-black">Проекти</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link text-black">Контакти</a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>

    <!-- Про мене -->
    <main>
      <div class="container my-5">
        <div class="row align-items-center">
          <div class="col-md-6 text-center">
            <div
              class="bg-light d-flex justify-content-center align-items-center"
              style="border-radius: 8px; overflow: hidden; height: 300px"
            >
              <img
                src="images/Architecture Portfolio Projects __ Photos, videos, logos, illustrations and branding.jpg"
                alt="Architecture Portfolio"
                style="width: 100%; height: 100%; object-fit: cover"
              />
            </div>
          </div>
          <div class="col-md-6">
            <h2 class="mb-3 p-2">Про мене</h2>
            <p>
              Я веб-розробник із досвідом створення адаптивних сайтів. Моя мета
              — створювати функціональні та сучасні веб-додатки.
            </p>
          </div>
        </div>
      </div>

      <!-- Проекти -->
      <div class="container my-5">
        <h2 class="text-center mb-4">Мої проекти</h2>
        <div class="row">
          <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100 shadow-sm">
              <img
                src="images/Search Projects __ Photos, videos, logos, illustrations and branding.jpg"
                class="card-img-top"
                alt="Проект 1"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Проект 1</h5>
                <p class="card-text">Опис проекту.</p>
                <div class="mt-auto">
                  <a href="#" class="btn btn-dark">Детальніше</a>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100 shadow-sm">
              <img
                src="images/Portfolio Projects __ Photos, videos, logos, illustrations and branding.jpg"
                class="card-img-top"
                alt="Проект 2"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Проект 2</h5>
                <p class="card-text">Опис проекту.</p>
                <div class="mt-auto">
                  <a href="#" class="btn btn-dark">Детальніше</a>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6 col-lg-4 mb-4">
            <div class="card h-100 shadow-sm">
              <img
                src="images/Portfolio | CV - Susi Sánchez Arias.jpg"
                class="card-img-top"
                alt="Проект 3"
              />
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Проект 3</h5>
                <p class="card-text">Опис проекту.</p>
                <div class="mt-auto">
                  <a href="#" class="btn btn-dark">Детальніше</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
